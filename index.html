<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>学生作品紹介</title>
  <link rel="stylesheet" href="styles/main.css">
  <script defer src="scripts/main.js"></script>
</head>
<body>
  <header>
    <h1>学生作品紹介</h1>
    <p>作品一覧 — クリックで詳細ページへ</p>
  </header>

  <main id="content">
    <div id="filters" class="filters">
      <input id="search" type="search" placeholder="検索（タイトル・説明）" aria-label="作品検索">
      <select id="tech-filter" aria-label="技術で絞り込み">
        <option value="all">すべての技術</option>
      </select>
    </div>
    <div id="projects" class="grid"></div>
  </main>

  <footer>
    <small>© 学生作品紹介</small>
  </footer>
</body>
</html>
